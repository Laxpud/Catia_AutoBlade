[project]
name = "catia-autoblade"
dynamic = ["version"]
description = "CATIA automation tool for creating blades"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Laxpud", email = "mi.shore@foxmail.com" }
]
keywords = ["catia", "automation", "blade", "cad"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pywin32==311; sys_platform == 'win32'",
    "typer>=0.24,<0.25",
    "questionary>=2.1,<3",
    "pydantic>=2.12,<3",
    "tomlkit>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
autoblade = "catia_autoblade.cli:app"
autoblade-create = "catia_autoblade.cli:create_entrypoint"
autoblade-batch = "catia_autoblade.cli:batch_entrypoint"

[project.urls]
Homepage = "https://github.com/Laxpud/catia-autoblade"
Repository = "https://github.com/Laxpud/catia-autoblade"
Documentation = "https://github.com/Laxpud/catia-autoblade/tree/main/docs"
Issues = "https://github.com/Laxpud/catia-autoblade/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/catia_autoblade/__init__.py"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
