[project]
name = "catia-autoblade"
dynamic = ["version"]
description = "CATIA automation tool for creating blades"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Laxpud", email = "mi.shore@foxmail.com" }
]
keywords = ["catia", "automation", "blade", "cad"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pywin32==311; sys_platform == 'win32'",
    "typer>=0.24,<0.25",
    "questionary>=2.1,<3",
    "pydantic>=2.12,<3",
    "tomlkit>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
autoblade = "catia_autoblade.cli:app"
autoblade-create = "catia_autoblade.cli:create_entrypoint"
autoblade-batch = "catia_autoblade.cli:batch_entrypoint"

[project.urls]
Homepage = "https://github.com/Laxpud/catia-autoblade"
Repository = "https://github.com/Laxpud/catia-autoblade"
Documentation = "https://github.com/Laxpud/catia-autoblade/tree/main/docs"
Issues = "https://github.com/Laxpud/catia-autoblade/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/catia_autoblade/__init__.py"

[tool.hatch.build]
exclude = [
    "/.git",
    "/.pytest_cache",
    "/.test-tmp-*",
    "/.uv",
    "/.venv",
    "/build",
    "/dist",
    "/output",
    "**/__pycache__",
    "**/*.CATPart",
    "**/*.CATProduct",
    "**/*.log",
    "**/*.stp",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catia_autoblade"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows/checks.yml",
    "/AGENTS.md",
    "/LICENSE",
    "/README.md",
    "/TODO.md",
    "/config.toml",
    "/docs",
    "/input/README.md",
    "/input/airfoils/airfoil1_sharp.csv",
    "/input/airfoils/airfoil1_sharp_dense_1000.csv",
    "/input/airfoils/airfoil2_sharp.csv",
    "/input/airfoils/airfoil3_sharp.csv",
    "/input/airfoils/naca0012_sharp.csv",
    "/input/airfoils/sc1095.csv",
    "/input/airfoils/sc1095_sharp.csv",
    "/input/airfoils/sd7032_sharp.csv",
    "/input/section_params/section_params-1.csv",
    "/input/section_params/section_params-2.csv",
    "/input/section_params/section_params-3.csv",
    "/input/section_params/section_params-4.csv",
    "/input/section_params/section_params-5.csv",
    "/input/section_params/section_params-multi-airfoil.csv",
    "/input/section_params/section_params-naca.csv",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
